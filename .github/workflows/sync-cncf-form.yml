name: Sync CNCF application form

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    # Maintainer-only: keep the template form snapshot current.
    if: github.event.repository.is_template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check upstream form
        id: check
        run: |
          set +e
          python3 scripts/sync_cncf_form.py --check --report | tee form-sync-report.md
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync form artifacts
        if: steps.check.outputs.drift == 'true'
        run: python3 scripts/sync_cncf_form.py --write --merge-application --report | tee form-sync-report.md

      - name: Open pull request
        if: steps.check.outputs.drift == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: sync CNCF sandbox application form"
          title: "chore: sync CNCF sandbox application form"
          body-path: form-sync-report.md
          branch: chore/sync-cncf-form
          delete-branch: true
