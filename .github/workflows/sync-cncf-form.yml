name: Sync CNCF application form

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    # Maintainer-only: keep the template form snapshot current.
    if: github.event.repository.is_template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Needed so the bot can push a sync branch.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check upstream form
        id: check
        run: |
          set +e
          python3 scripts/sync_cncf_form.py --check --report | tee form-sync-report.md
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync form artifacts
        if: steps.check.outputs.drift == 'true'
        run: python3 scripts/sync_cncf_form.py --write --merge-application --report | tee form-sync-report.md

      # Org policy blocks Actions from creating PRs. Push a branch instead;
      # a maintainer can open the PR from the compare link in the job summary.
      - name: Push sync branch
        if: steps.check.outputs.drift == 'true'
        env:
          BRANCH: chore/sync-cncf-form
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No file changes after sync; nothing to push."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "${BRANCH}"
          # Report is for humans reading the Actions summary; do not commit it.
          git add -A
          git reset -- form-sync-report.md 2>/dev/null || true
          git commit -m "chore: sync CNCF sandbox application form"
          git push --force-with-lease origin "HEAD:refs/heads/${BRANCH}"

          compare_url="${{ github.server_url }}/${{ github.repository }}/compare/${{ github.event.repository.default_branch }}...${BRANCH}?expand=1"
          {
            echo "## CNCF form sync branch ready"
            echo
            echo "Org policy prevents Actions from opening PRs."
            echo
            echo "- Branch: \`${BRANCH}\`"
            echo "- Open a PR: ${compare_url}"
            echo
            echo "### Sync report"
            echo
            cat form-sync-report.md
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Pushed ${BRANCH}. Open a PR: ${compare_url}"
