name: Sync checklist on issue close

on:
  issues:
    types: [closed]

permissions:
  contents: write

jobs:
  sync-checklist:
    runs-on: ubuntu-latest
    # Ignore closes caused by bot sync noise; only checklist-item issues.
    if: >
      contains(github.event.issue.labels.*.name, 'checklist-item') &&
      github.event.issue.user.type != 'Bot'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Find checklist slug from labels
        id: slug
        run: |
          slug=$(echo '${{ toJson(github.event.issue.labels.*.name) }}' | jq -r '.[] | select(startswith("checklist:") and . != "checklist-item") | sub("checklist:"; "")')
          if [ -z "$slug" ]; then
            echo "No checklist slug label found; skipping."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "Syncing checklist item: $slug (issue #${{ github.event.issue.number }})"

      - name: Mark checkbox complete and update progress
        if: steps.slug.outputs.found == 'true'
        id: update
        env:
          CHECKLIST_SLUG: ${{ steps.slug.outputs.slug }}
        run: |
          python3 scripts/checklist_tracking.py complete-checkbox --slug "${CHECKLIST_SLUG}"
          python3 scripts/update_checklist_progress.py

          if git diff --quiet APPLICATION.md README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Commit directly to main. Do not open a follow-up bot PR — that re-triggers
      # pull_request workflows and produces approval/noise cascades.
      # Commits made with GITHUB_TOKEN do not start new workflow runs.
      - name: Commit checklist update to main
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add APPLICATION.md README.md
          git commit -m "docs: mark checklist item ${{ steps.slug.outputs.slug }} complete"
          git push origin HEAD:main
